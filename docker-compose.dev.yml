name: template-app-dev # Affects container/network/volume prefixes

services:
  postgres:
    image: postgres:17 # Runs on port 5432 by default
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped # Keep DB up across docker restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"] # Escape so container shell sees environment vars
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./apps/backend:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             alembic upgrade head"
    env_file:
      - ./apps/backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      LOGS_DIR: app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./apps/backend:/app # Live code on host machine
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ./apps/backend/.env # Mount correct environment file
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      LOGS_DIR: /app/logs
      WATCHFILES_FORCE_POLLING: "true" # Hot reloads for dev
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      DOCKER: "true"
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./apps/nginx/conf.d/web.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_dev_data:
  web_node_modules:
